name: Release

# Push a tag like v0.2.0 to publish a release. "Run workflow" (workflow_dispatch) builds everything
# and keeps the files as workflow artifacts without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  app:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14 }
          - { name: macos-x64, os: macos-15-intel }
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x64, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Version
        id: version
        shell: bash
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('backend/app/__init__.py').read()).group(1))")
          echo "value=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$(echo "${GITHUB_REF_NAME#v}" | sed 's/-.*//')" != "$v" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version $v in backend/app/__init__.py" >&2; exit 1
          fi
      - name: Tests and dependencies
        shell: bash
        working-directory: backend
        run: |
          uv sync --frozen --python "$PYTHON_VERSION" --group desktop --group build
          uv run pytest -q
          uv run python ../packaging/make_icons.py
      - name: Build
        shell: bash
        working-directory: backend
        run: uv run pyinstaller ../packaging/chorus.spec --noconfirm --distpath ../dist --workpath ../build
      - name: Smoke test (starts the built app and plays a round trip)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   exe="dist/Chorus.app/Contents/MacOS/Chorus" ;;
            Windows) exe="dist/Chorus/Chorus.exe" ;;
            Linux)   exe="dist/chorus/chorus" ;;
          esac
          python packaging/smoke.py "$exe"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - dist/Chorus.app
          mkdir -p out dmg && cp -R dist/Chorus.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Chorus -srcfolder dmg -ov -format UDZO \
            "out/Chorus-${{ steps.version.outputs.value }}-${{ matrix.name }}.dmg"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" packaging\windows\chorus.iss
          Move-Item "dist\Chorus-Setup-${{ steps.version.outputs.value }}.exe" out\
          Compress-Archive -Path dist\Chorus -DestinationPath "out\Chorus-${{ steps.version.outputs.value }}-${{ matrix.name }}.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out stage
          cp -R dist/chorus stage/chorus
          cp packaging/linux/chorus.service packaging/linux/chorus.env.example packaging/linux/INSTALL.md stage/
          tar -C stage -czf "out/chorus-${{ steps.version.outputs.value }}-${{ matrix.name }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: out/*

  docker:
    needs: web
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [app]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: files
          merge-multiple: true
      - name: Checksums
        working-directory: files
        run: sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # a release made by hand on the web page for this tag: attach the files to it, keep its title and notes
            gh release upload "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" \
              --title "Chorus ${GITHUB_REF_NAME#v}" --generate-notes $prerelease
          fi
