[project]
name = "chorus-backend"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "mutagen>=1.48.1",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
    "wordfreq>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Desktop app (tray icon). Not needed on a server or in the Docker image.
desktop = [
    "pillow>=11",
    "pystray>=0.19.5",
]
# Building the packaged apps (packaging/chorus.spec).
build = [
    "pyinstaller>=6.11",
]

[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
testpaths = ["tests"]
